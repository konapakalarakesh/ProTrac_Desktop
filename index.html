<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta charset="UTF-8">
    <title>Amazon prod tracker</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
    
    :root { 
        --amz: #FF9900; 
        --dark: #0F172A; 
        --slate: #64748B; 
        --border: #E2E8F0; 
        --bg: #F8FAFC; 
        --card: rgba(255, 255, 255, 0.95); /* Adjusted to 95% to let background show */
        --text: #0F172A; 
        --dot: #cbd5e1; 
    }

    body.dark-mode { 
        --bg: #020617; 
        --card: rgba(15, 23, 42, 0.95); /* Adjusted for Dark Mode */
        --text: #F8FAFC; 
        --border: #1E293B; 
        --slate: #94A3B8; 
        --dot: #1e293b; 
    }
    
    /* THE HIGH-LEVEL ATMOSPHERE */
    body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: var(--bg); 
        color: var(--text); 
        margin: 0; 
        min-height: 100vh; 
        transition: background 0.5s ease;
        position: relative;
        overflow-x: hidden;
    }

    /* THE MOVING AURORA */
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: 
            radial-gradient(circle at 15% 15%, rgba(255, 153, 0, 0.1) 0%, transparent 40%),
            radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        filter: blur(60px);
        z-index: -1;
        animation: drift 15s infinite alternate ease-in-out;
        pointer-events: none;
    }

    /* THE MICRO-GRID OVERLAY */
    body::after {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
        background-size: 40px 40px;
        opacity: 0.4;
        z-index: -1;
        pointer-events: none;
    }

    @keyframes drift {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.1) translate(2%, 2%); }
    }
    
    header { background: #1E293B; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--amz); z-index: 100; position: sticky; top: 0; }
    .logo b { color: var(--amz); text-transform: capitalize; }
   #update-toast { 
    position: fixed; top: -100px; left: 50%; transform: translateX(-50%); 
    /* Thick Silk Gradient: White, Soft Blue, and Rose Pink */
    background: linear-gradient(135deg, #ffffff 0%, #dbeafe 50%, #fbcfe8 100%);
    backdrop-filter: blur(15px);
    
    /* Contrast Text: Deep Navy for maximum legibility on light colors */
    color: #1a2331; 
    padding: 12px 30px; 
    border-radius: 50px; 
    
    /* Clean & Sleek Text Style */
    font-weight: 600; 
    font-size: 14px; 
    letter-spacing: 0.6px;
    z-index: 50000;
    
    display: flex; align-items: center; gap: 12px; 
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    
    /* No Shadow as requested */
    box-shadow: none; 
    
    transition: top 0.6s cubic-bezier(0.19, 1, 0.22, 1);
}

#update-toast.show { top: 30px; }

.toast-emoji { 
    font-size: 20px; 
    animation: luxury-float 3s infinite ease-in-out; 
}

@keyframes luxury-float { 
    0%, 100% { transform: translateY(0) rotate(-4deg); } 
    50% { transform: translateY(-6px) rotate(4deg); } 
}

    #crazy-pop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 20000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .pop-content { background: var(--card); padding: 40px; border-radius: 40px; text-align: center; border: 3px solid var(--amz); }
    .tabs { display: flex; gap: 5px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
    .tab { padding: 6px 14px; border: none; border-radius: 7px; cursor: pointer; font-weight: 700; font-size: 11px; color: #94A3B8; background: transparent; }
    .tab.active { background: white !important; color: #0F172A !important; }
    
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 15px 30px; position: sticky; top: 58px; z-index: 99; backdrop-filter: blur(10px); }
    
    .chip { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 11px; font-weight: 600; background: var(--bg); color: var(--text); margin-right: 5px; margin-bottom: 5px; display: inline-block; }
    .chip.a-active { background: #3B82F6; color: white; border-color: #3B82F6; }
    .chip.v-active { background: #10B981; color: white; border-color: #10B981; }

    main { display: flex; gap: 25px; padding: 25px 30px; min-height: calc(100vh - 180px); align-items: flex-start; flex-wrap: wrap; }
    .scroll-side { flex: 1; min-width: 400px; padding-bottom: 50px; }
    .sticky-side { width: 400px; position: sticky; top: 150px; }

    @media (max-width: 1000px) {
        .sticky-side { width: 100%; position: relative; top: 0; }
        .scroll-side { min-width: 100%; }
    }

    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); margin-bottom: 15px; backdrop-filter: blur(5px); }
    .card-h { padding: 10px 15px; font-weight: 800; font-size: 11px; border-bottom: 1px solid var(--border); color: var(--slate); text-transform: uppercase; background: rgba(0,0,0,0.02); }
    .magic-score { background: var(--card); border-radius: 35px; padding: 35px 20px; text-align: center; border: 1px solid var(--border); transition: 0.3s; backdrop-filter: blur(10px); }
    .prod-val { font-family: 'Montserrat', sans-serif; font-size: 90px; font-weight: 900; letter-spacing: -4px; line-height: 0.8; }
    
    #summary-ui { display: flex; flex-direction: column; padding: 30px; gap: 25px; min-height: calc(100vh - 80px); }
    .summary-top { display: flex; gap: 25px; align-items: flex-start; flex-wrap: wrap; }
    .st-container { flex: 1; min-width: 400px; }
    .st { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 15px; border: 1px solid var(--border); overflow: hidden; backdrop-filter: blur(10px); }
    .st th { background: rgba(0,0,0,0.05); padding: 12px; font-size: 10px; color: var(--slate); text-align: left; }
    .st td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text); }
    .btn-mini { background: transparent; border: 1px solid #FCA5A5; padding: 6px; border-radius: 8px; color: #EF4444; font-size: 9px; font-weight: 800; cursor: pointer; }
    .hidden { display: none !important; }
    #name-gate { position: fixed; inset: 0; background: #0F172A; z-index: 30000; display: flex; align-items: center; justify-content: center; color: white; }
</style>
</head>

<header>

        </div>

    <div class="logo" id="main-logo" style="font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.9); letter-spacing: 2px; white-space: nowrap; text-transform: uppercase;">
    </div>

    <div style="display:flex; align-items:center; gap:20px;">
        <div class="tabs" id="day-tabs"></div>

    </div>
</header>

<div class="selector-bar" id="sel-area">
    <div style="margin-bottom:8px;"><span style="font-size:10px; font-weight:800; color:#FF9900; width:110px; display:inline-block;">AUDITS</span><div id="audit-chips" style="display:inline-flex; flex-wrap:wrap;"></div></div>
    <div><span style="font-size:10px; font-weight:800; color:#FF9900; width:110px; display:inline-block;">VERIFICATIONS</span><div id="verif-chips" style="display:inline-flex; flex-wrap:wrap;"></div></div>
</div>

<main id="main-ui">
    <div id="card-zone" class="scroll-side"></div>
    <div class="sticky-side">
        <div id="magic-box" class="magic-score">
            <span id="prod-emoji" style="font-size: 40px; display: block; margin-bottom: 10px;">🐢</span>
            <div id="prod-out" class="prod-val">0%</div>
            <span id="caption-out" style="font-weight:800; font-size:11px; margin-top:10px; display:block;">READY</span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
            <div style="background:var(--card); padding:8px; border-radius:15px; border:1px solid var(--border); text-align:center;"><label style="font-size:9px; font-weight:800; color:var(--slate);">SHIFT (HRS)</label><input type="number" min="0" onkeydown="return isPos(event)" id="s-in" value="8" oninput="updateBase()" style="width:100%; border:none; font-size:18px; font-weight:800; text-align:center; outline:none; background:transparent; color:var(--text);"></div>
            <div style="background:var(--card); padding:8px; border-radius:15px; border:1px solid var(--border); text-align:center;"><label style="font-size:9px; font-weight:800; color:var(--slate);">NPH (MINS)</label><input type="number" min="0" max="480" onkeydown="return isPos(event)" id="n-in" value="0" oninput="updateBase()" style="width:100%; border:none; font-size:18px; font-weight:800; text-align:center; outline:none; background:transparent; color:var(--text);"></div>

    --/--/----
</span>

    <label style="font-size:9px; font-weight:800; color:var(--amz); text-transform:uppercase; display: block; margin-bottom: 8px;">NPH Reasons / Remarks</label>
    
    <textarea id="nph-reason-day" 
    oninput="saveReason()" 
    onkeydown="if(event.key==='Enter'){ 
        event.preventDefault(); 
        const lines = this.value.trim().split('\n');
        const lastLine = lines[lines.length-1];
        const match = lastLine.match(/^(\d+)\./);
        if(!match && this.value.trim().length > 0) this.value = '1. ' + this.value;
        const nextNum = match ? parseInt(match[1]) + 1 : (this.value.trim() ? 2 : 1);
        this.value = this.value.trim() + '\n' + nextNum + '. ';
        saveReason();
    }"
    placeholder=" Ex &#10; 1. Team meeting&#10;2. Deep dive" 
    style="width:100%; border:none; font-size:12px; font-weight:600; text-align:left; outline:none; background:transparent; color:var(--text); resize:none; font-family:inherit; height:65px; padding:0; line-height:1.4; opacity: 0.8;">1. </textarea>
</div>
        <div onclick="clearDay()" style="cursor:pointer; text-align:center; font-size:10px; font-weight:800; color:var(--slate); background:var(--bg); padding:8px; border-radius:15px; margin:10px auto 0 auto; width:80%; transition:0.2s; border:1px solid var(--border);" onmouseover="this.style.background='#EF4444'; this.style.color='white'; this.style.borderColor='#EF4444'" onmouseout="this.style.background='var(--bg)'; this.style.color='var(--slate)'; this.style.borderColor='var(--border)'">RESET DAY ↺</div>

                <span id="week-caption-out" style="font-weight:800; font-size:12px; margin-top:15px; display:block;">WEEKLY AGGREGATE</span>
            </div>

            <button onclick="downloadTextReport()" 
    style="width:80%; display:block; margin:15px auto; padding:10px; border-radius:15px; font-size:10px; font-weight:800; text-transform:uppercase; cursor:pointer; transition:0.2s; background:transparent; color:#007185; border:1px solid rgba(0, 113, 133, 0.3);"

    onmouseout="this.style.background='transparent'; this.style.color='#007185'; this.style.borderColor='rgba(0, 113, 133, 0.3)';">
    Download Weekly Report</button>

            <div onclick="resetAll()" style="cursor:pointer; text-align:center; font-size:10px; font-weight:800; color:var(--slate); background:var(--bg); padding:10px; border-radius:15px; margin:15px auto; width:80%; transition:0.2s; border:1px solid var(--border);" 
                onmouseover="this.style.background='#EF4444'; this.style.color='white'; this.style.borderColor='#EF4444'" 
                onmouseout="this.style.background='var(--bg)'; this.style.color='var(--slate)'; this.style.borderColor='var(--border)'">
                WIPE WEEKLY DATA 🗑️
            </div>

            <div style="background:var(--card); border:1px solid var(--border); border-radius:15px; padding:15px;">
                <label style="font-size:9px; font-weight:800; color:var(--amz); text-transform:uppercase; display:block; margin-bottom:12px;">Quick Links</label>
                <div style="display:flex; flex-direction:column; gap:8px;">
    <a href="https://www.cp-central.catalog.amazon.dev/#/annotator/time-tracker" target="_blank" 
       style="text-decoration:none; display:flex; justify-content:space-between; padding:10px; background:var(--bg); border-radius:10px; border:1px solid var(--border); transition:0.2s;" 
       onmouseover="this.style.background='rgba(255,153,0,0.9)'; this.style.transform='translateX(5px)'; this.querySelector('span').style.color='white';" 
       onmouseout="this.style.background='var(--bg)'; this.style.transform='translateX(0)'; this.querySelector('span').style.color='var(--text)';"
    >
        <span style="font-size:11px; font-weight:700; color:var(--text); transition:0.2s;">Apply NPH</span>
        <span style="color:var(--amz);">↗</span>
    </a>

    <a href="https://atoz.amazon.work/time/request" target="_blank" 
       style="text-decoration:none; display:flex; justify-content:space-between; padding:10px; background:var(--bg); border-radius:10px; border:1px solid var(--border); transition:0.2s;" 
       onmouseover="this.style.background='rgba(59,130,246,0.9)'; this.style.transform='translateX(5px)'; this.querySelector('span').style.color='white';" 
       onmouseout="this.style.background='var(--bg)'; this.style.transform='translateX(0)'; this.querySelector('span').style.color='var(--text)';"
    >
        <span style="font-size:11px; font-weight:700; color:var(--text); transition:0.2s;">Apply Leaves</span>
        <span style="color:#3B82F6;">↗</span>
    </a>
          </div>
            </div>
        </div>
    </div>
</div>            
<script>
const CONFIG = {
    audits: {
        "LE Validation": { "BV": 80, "Invalid": 61, "Valid": 78, "Plausible": 148 },
        "Barcode Audit": { "Audits": 310 },
        "BLMA Audit": { "Audits": 2400 },

        "Anchor Appeals": { "Out Scope": 209, "Inconsistent": 372, "Inscope": 510, "IKS Update": 627, "Addl Curation": 58 },
        "RCA Audit": { "Audit": 600 },

        "Supp-Prechecks": { "BAKS signal": 18, "Flavor": 18, "Size": 24, "Color": 24, "Item_Name": 30, "Brand": 24, "GCORID/ Stamping Issue": 18, "Product Type": 12 },

        "GTIN Update verif": { "verif": 600 },

    }
};

function isPos(e) { if (['-', 'e', '+'].includes(e.key)) e.preventDefault(); }

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioCtx();
function playSound(type) {
    if(ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if(type === 'pop') { osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.1); }
    else if(type === 'success') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.5); gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5); }
    else if(type === 'tick') { osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime); gain.gain.setValueAtTime(0.05, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.05); }
    osc.start(); osc.stop(ctx.currentTime + 0.5);
}

// Fixed State Initialization to include 'reasons'
let state = JSON.parse(localStorage.getItem('ops_vFinal_v4')) || { 
    owner: '', day: 'Mon', darkMode: false, lastProd: 0, 
    active: { Mon:[], Tue:[], Wed:[], Thu:[], Fri:[] }, 
    data: { Mon:{}, Tue:{}, Wed:{}, Thu:{}, Fri:{} }, 
    reasons: { Mon:'', Tue:'', Wed:'', Thu:'', Fri:'' }, 
    hours: { Mon:{s:8, n:0, r:1}, Tue:{s:8, n:0, r:1}, Wed:{s:8, n:0, r:1}, Thu:{s:8, n:0, r:1}, Fri:{s:8, n:0, r:1} } 
};

// If old user doesn't have reasons object, add it
if(!state.reasons) state.reasons = { Mon:'', Tue:'', Wed:'', Thu:'', Fri:'' };

function toggleDark() { playSound('pop'); state.darkMode = !state.darkMode; applyTheme(); save(); }
function applyTheme() { document.body.classList.toggle('dark-mode', state.darkMode); }
function setName() { const n = document.getElementById('user-name-in').value.trim(); if(n) { state.owner = n.charAt(0).toUpperCase() + n.slice(1).toLowerCase(); init(); showCrazyPop(); } }
function showCrazyPop() { playSound('success'); const p = document.getElementById('crazy-pop'); document.getElementById('pop-title').innerText = `HELLO, ${state.owner.toUpperCase()}!`; p.style.display = 'flex'; setTimeout(() => p.style.display = 'none', 3000); }

function showCredits(e) {
    if(e) e.stopPropagation(); 
    const p = document.getElementById('crazy-pop');
    const title = document.getElementById('pop-title');
    const subtext = p.querySelector('p:nth-of-type(1)');
    const originalTitle = title.innerHTML;
    const originalSub = subtext.innerHTML;
    title.innerHTML = `<span style="font-size:16px; color:var(--slate); font-weight:600;">Developed by</span><br><span style="color:var(--amz)">RAKESH KONAPAKALA</span>`;
    subtext.innerHTML = `Alias: <b>konapaks</b>`;
    p.style.display = 'flex';
    playSound('success');
    setTimeout(() => {
        p.style.display = 'none';
        title.innerHTML = originalTitle;
        subtext.innerHTML = originalSub;

}

const principles = ["Customer Obsession", "Ownership", "Invent and Simplify", "Are Right, A Lot", "Learn and Be Curious", "Hire and Develop the Best", "Insist on the Highest Standards", "Think Big", "Bias for Action", "Frugality", "Earn Trust", "Dive Deep", "Have Backbone; Disagree and Commit", "Deliver Results", "Strive to be Earth’s Best Employer", "Success and Scale Bring Broad Responsibility"];

function init() {
    if(!state.owner) return;
    document.getElementById('name-gate').classList.add('hidden');
    applyTheme(); 
    const randomPrinciple = principles[Math.floor(Math.random() * principles.length)];
    document.getElementById('main-logo').innerHTML = `${randomPrinciple} × <span style="color:var(--amz)">${state.owner}</span>`;
    const tabs = document.getElementById('day-tabs'); tabs.innerHTML = '';
    ['Mon','Tue','Wed','Thu','Fri','Weekly Scope'].forEach(d => {
        const b = document.createElement('button'); b.className = `tab ${state.day === d ? 'active' : ''}`; b.innerText = d; 
        b.onclick = () => { playSound('pop'); state.day = d; init(); }; tabs.appendChild(b);
    });
    render();
}

function triggerToast() {
    const expiry = new Date('2026-05-08T23:59:59').getTime();
    if (Date.now() < expiry) {
        const toast = document.getElementById('update-toast');
        document.getElementById('toast-msg').innerText = `Hey ${state.owner.toUpperCase()}  BAKS AHT Got Updated📣`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 6000);
    }
}

function render() {
    save();
    const isWeekly = state.day === 'Weekly Scope';
    document.getElementById('sel-area').classList.toggle('hidden', isWeekly);
    document.getElementById('main-ui').classList.toggle('hidden', isWeekly);
    document.getElementById('summary-ui').classList.toggle('hidden', !isWeekly);
    if(isWeekly) { document.getElementById('summary-title').innerText = `${state.owner}'s Performance Universe`; renderSummary(); }
    else {
        document.getElementById('s-in').value = state.hours[state.day].s; 
        document.getElementById('n-in').value = state.hours[state.day].n;
        // Correctly load the reason for the current day
        document.getElementById('nph-reason-day').value = state.reasons[state.day] || "";
        renderChips('audits', 'audit-chips', 'a-active'); 
        renderChips('verif', 'verif-chips', 'v-active');
        updateSmartDate();
        renderCards(); calculate();
    }
}

function renderChips(cat, target, cls) {
    const div = document.getElementById(target); div.innerHTML = '';
    Object.keys(CONFIG[cat]).forEach(k => {
        const c = document.createElement('div'); c.className = `chip ${state.active[state.day].includes(k) ? cls : ''}`; c.innerText = k;
        c.onclick = () => { playSound('pop'); let list = state.active[state.day]; state.active[state.day] = list.includes(k) ? list.filter(i => i !== k) : [...list, k]; render(); };
        div.appendChild(c);
    });
}

function renderCards() {
    const zone = document.getElementById('card-zone'); zone.innerHTML = '';
    state.active[state.day].forEach(k => {
        const conf = CONFIG.audits[k] || CONFIG.verif[k];
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="card-h">${k}</div><div style="padding:12px">${Object.entries(conf).map(([t, a]) => `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <label style="font-size:11px;font-weight:700;">${t}</label>
                <input type="number" 
                       min="0" 
                       onkeydown="return isPos(event)" 
                       value="${state.data[state.day][k+'_'+t] || ''}" 
                       oninput="if(this.value.length > 4) this.value = this.value.slice(0,4); playSound('tick'); state.data[state.day]['${k+'_'+t}']=this.value; calculate();" 
                       style="width:70px;padding:6px;border-radius:10px;border:1px solid var(--border);text-align:center;font-weight:800;background:var(--bg);color:var(--text);outline:none;">
            </div>`).join('')}</div>`;
        zone.appendChild(card);
    });
}

function calculate() {
    let earned = 0; const h = state.hours[state.day]; 
    const ramp = 1; // Defaulted to 1 as multiplier was replaced by text area

    h.n = Math.min(480, Math.max(0, parseInt(h.n) || 0));

    state.active[state.day].forEach(k => { 
        const conf = CONFIG.audits[k] || CONFIG.verif[k]; 
        Object.entries(conf).forEach(([t, a]) => {
            const val = parseFloat(state.data[state.day][k+'_'+t]) || 0;
            earned += val * a;
        }); 
    });

    const shiftMins = (parseFloat(h.s) || 8) * 60;
    const baseProd = shiftMins > 0 ? (h.n / shiftMins) * 100 : 0;
    const earnedHours = earned / 3600;
    const outputProd = (parseFloat(h.s) || 8) > 0 ? (earnedHours / h.s) * 100 : 0;

    const prod = Math.round(baseProd + outputProd);
    if(prod >= 100 && state.lastProd < 100) playSound('success');
    state.lastProd = prod; 
    updateUI(prod, 'prod-out', 'caption-out', 'prod-emoji', 'magic-box');
}

function updateUI(prod, outId, capId, emoId, boxId) {
    const out = document.getElementById(outId); const cap = document.getElementById(capId);
    const emo = document.getElementById(emoId); const box = document.getElementById(boxId);
    if(!out || !cap || !emo || !box) return;
    const displayProd = Math.min(prod, 1000);
    out.innerText = displayProd + '%';
    const tiers = [{l:100,m:"GOD MODE!",e:"🚀"},{l:70,m:"High Velocity",e:"🔥"},{l:40,m:"Solid",e:"💪"},{l:0,m:"Ready",e:"🔋"}];
    const t = tiers.find(x => prod >= x.l);
    out.style.color = prod >= 100 ? '#FF9900' : 'var(--text)';
    cap.innerText = t.m.toUpperCase(); emo.innerText = t.e;
    if(prod >= 100) { box.style.borderColor = '#FF9900'; confetti({particleCount:40, spread:50}); } else { box.style.borderColor = 'var(--border)'; }
}

function renderSummary() {
    const body = document.getElementById('sum-body');
    document.getElementById('st-head').innerHTML = `<tr><th>PROCESS DETAIL</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th style="color:var(--amz)">TOTAL</th></tr>`;
    body.innerHTML = ''; const tasks = new Set(); 
    let wE = 0; let totalNph = 0;

    ['Mon','Tue','Wed','Thu','Fri'].forEach(d => {
        state.active[d].forEach(k => tasks.add(k)); 
        totalNph += (parseInt(state.hours[d].n) || 0);
        state.active[d].forEach(k => { 
            const conf = CONFIG.audits[k] || CONFIG.verif[k]; 
            Object.entries(conf).forEach(([t, a]) => wE += (parseFloat(state.data[d][k+'_'+t]) || 0) * a); 
        });
    });

    tasks.forEach(k => {
        Object.keys(CONFIG.audits[k] || CONFIG.verif[k]).forEach(t => {
            let r = `<tr><td><b style="font-size:12px">${k}</b><br><small style="color:var(--slate)">${t}</small></td>`, tot = 0;
            ['Mon','Tue','Wed','Thu','Fri'].forEach(d => { let v = parseInt(state.data[d][k+'_'+t])||0; r+=`<td>${v||'-'}</td>`; tot+=v; });
            if(tot > 0) body.innerHTML += r + `<td style="font-weight:900;color:var(--amz);text-align:center;">${tot}</td></tr>`;
        });
    });
  // ONLY SHOW NPH IF THERE IS DATA
    if (totalNph > 0) {
        let nphR = `<tr style="background:rgba(255,153,0,0.05); font-weight:700;"><td>NON-PRODUCTIVE (NPH)</td>`;
        ['Mon','Tue','Wed','Thu','Fri'].forEach(d => {
            let n = parseInt(state.hours[d].n) || 0;
            nphR += `<td>${n ? n + 'm' : '-'}</td>`;
        });
        body.innerHTML += nphR + `<td style="color:var(--amz); font-weight:900; text-align:center;">${totalNph}m</td></tr>`;
    }

    const totalShiftMins = 5 * 8 * 60;
    const baseWProd = (totalNph / totalShiftMins) * 100;
    const outputWProd = ((wE/3600) / 40) * 100;
    const wProd = Math.round(baseWProd + outputWProd);
    
    updateUI(wProd, 'week-prod-out', 'week-caption-out', 'week-emoji', 'week-magic-box');
}

function updateBase() { 
    playSound('tick'); 
    let nInput = document.getElementById('n-in');
    let sInput = document.getElementById('s-in');

    let nVal = parseInt(nInput.value) || 0;
    if (nVal > 480) nVal = 480;
    if (nVal < 0) nVal = 0;
    nInput.value = nVal;

    state.hours[state.day].s = sInput.value; 
    state.hours[state.day].n = nVal; 
    // Removed ramp-val-day logic to prevent crashes
    calculate();
}

function saveReason() {
    state.reasons[state.day] = document.getElementById('nph-reason-day').value;
    save();
}

// 1. Reset Current Day (Only clears today's metrics)
function clearDay() { 
    if(confirm("Clear today's data?")) { 
        state.data[state.day] = {}; 
        state.active[state.day] = []; 
        state.hours[state.day].n = 0; 
        state.reasons[state.day] = ""; 
        render(); 
    } 
}

// 2. Wipe Weekly Database (Clears all days, but keeps you logged in)
function resetAll() { 
    if(confirm("WIPE ALL WEEKLY DATA?")) { 
        const name = state.owner; // Save your name
        const theme = state.darkMode; // Save your theme
        state = { 
            owner: name, day: 'Mon', darkMode: theme, lastProd: 0, 
            active: { Mon:[], Tue:[], Wed:[], Thu:[], Fri:[] }, 
            data: { Mon:{}, Tue:{}, Wed:{}, Thu:{}, Fri:{} }, 
            reasons: { Mon:'', Tue:'', Wed:'', Thu:'', Fri:'' }, 
            hours: { Mon:{s:8, n:0, r:1}, Tue:{s:8, n:0, r:1}, Wed:{s:8, n:0, r:1}, Thu:{s:8, n:0, r:1}, Fri:{s:8, n:0, r:1} } 
        };
        save();
        location.reload(); 
    } 
}

// 3. New Logout Function (To actually exit the app)
function logout() {
    if(confirm("Logout & Clear data")) {
        localStorage.clear();
        location.reload();
    }
}
function save() { localStorage.setItem('ops_vFinal_v4', JSON.stringify(state)); }

function downloadTextReport() {
    const s = JSON.parse(localStorage.getItem('ops_vFinal_v4'));
    if (!s || !s.owner) return alert("No data found!");

    let wk = "";
    while (wk !== null && wk.trim() === "") {
        wk = prompt("⚠️ Week Number is required to download:\nPlease enter Week Number:", "");
    }
    if (wk === null) return; 

    const dt = new Date().toLocaleDateString('en-GB');
  let csv = `WEEKLY PERFORMANCE REPORT\nAssociate,${s.owner.toUpperCase()}\nWeek Number,${wk}\nExport Date,${dt}\n\n`;
    csv += `Day,Process,Sub-Task,Count,Shift (Hrs),NPH (Mins),NPH Reasons,Daily Prod %\n`;
    
    let totalE = 0, totalN = 0;

    ['Mon','Tue','Wed','Thu','Fri'].forEach(d => {
        const h = s.hours[d];
      const reas = `"${(s.reasons[d] || "").replace(/"/g, '""')}"`;        
        let dayE = 0;
        let dayRows = [];

        s.active[d].forEach(k => {
            const conf = CONFIG.audits[k] || CONFIG.verif[k];
            Object.entries(conf).forEach(([t, a]) => {
                const v = parseInt(s.data[d][k+'_'+t]) || 0;
                if(v > 0) { dayE += (v * a); dayRows.push({ p: k, st: t, val: v }); }
            });
        });

        const dProd = Math.round(((h.n/480)*100) + (((dayE/3600)/8)*100));

        if (dayRows.length > 0) {
            dayRows.forEach((row, index) => {
                const dLab = (index === 0) ? d : "";
                const sVal = (index === 0) ? h.s : "";
                const nVal = (index === 0) ? h.n : "";
                const pVal = (index === 0) ? `${dProd}%` : "";
                csv += `${dLab},${row.p.replace(/,/g, "")},${row.st.replace(/,/g, "")},${row.val},${sVal},${nVal},${reas},${pVal}\n`;
            });
            csv += `\n`;
        } else {
            csv += `${d},No Activity,-,0,${h.s},${h.n},${reas},${dProd}%\n\n`;
        }
        totalE += dayE; totalN += parseInt(h.n)||0;
    });

    const wProd = Math.round(((totalN/2400)*100) + (((totalE/3600)/40)*100));
    csv += `TOTAL WEEKLY AGGREGATE,,,,,,,${wProd}%\n`;
    const BOM = '\uFEFF'; 
    const blob = new Blob([BOM + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Week_${wk}_${s.owner}_performance report.csv`;
    link.click();
}

window.onload = () => { 
    if(state.owner) { init(); triggerToast(); }
    else document.getElementById('user-name-in').focus();
};

document.addEventListener('input', (e) => {
    if(e.target.id !== 'nph-reason-day') save();
});
function updateSmartDate() {
    const daysMap = { 'Mon': 1, 'Tue': 2, 'Wed': 3, 'Thu': 4, 'Fri': 5 };
    const targetDay = daysMap[state.day];
    
    if (!targetDay) {
        document.getElementById('auto-date-display').innerText = "Weekly View";
        return;
    }

    const now = new Date();
    const currentDay = now.getDay(); // 0 is Sun, 1 is Mon...
    const diff = targetDay - currentDay;
    
    const displayDate = new Date(now);
    displayDate.setDate(now.getDate() + diff);

    const formatted = displayDate.toLocaleDateString('en-GB', { 
        day: '2-digit', month: 'short', year: 'numeric' 
    });

    document.getElementById('auto-date-display').innerText = formatted;
}
